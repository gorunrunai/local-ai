name: Test report for a Mac
description: Tell us how GoRunRun Local AI runs on your Mac, especially a memory size that hasn't been tested yet.
title: "[Test] <chip>, <memory> GB"
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Reports that everything works are as useful as reports of problems.
        See which Macs still need testing: https://local.gorunrun.ai/macs/
  - type: input
    id: mac
    attributes:
      label: Mac
      description: Apple menu > About This Mac.
      placeholder: MacBook Pro, M4 Max, 48 GB, macOS 26.0
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Chat model
      options: ["Qwen 3.5 (35B)", "Gemma 4 (12B)"]
    validations:
      required: true
  - type: dropdown
    id: video
    attributes:
      label: Video engines
      options: ["None", "LTX-2.3", "LTX-2.3 and Wan 2.2", "Wan 2.2 only"]
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: What worked
      options:
        - label: Installing
        - label: Chat
        - label: Photos and documents
        - label: Voice messages
        - label: Voice mode (talking out loud)
        - label: Web search
        - label: Creating a video
        - label: Phone access
  - type: textarea
    id: notes
    attributes:
      label: What was slow, failed or confusing?
      description: Include how long replies or videos took if you can. For failures, add the last lines of the log (Help > Show Logs in the app).
  - type: textarea
    id: dry_run
    attributes:
      label: Installer summary (optional)
      description: The review card from the installer, or the output of `install.sh --dry-run`.
      render: text
